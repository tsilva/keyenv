[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "keyenv-macos"
version = "0.1.1"
description = "Inject macOS Keychain credentials into explicitly launched processes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tiago Silva" },
]
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.7,<26",
]
keywords = ["cli", "developer-tools", "environment", "keychain", "macos", "secrets"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
keyenv = "keyenv.cli:main"

[project.urls]
Homepage = "https://github.com/tsilva/keyenv"
Repository = "https://github.com/tsilva/keyenv"
Issues = "https://github.com/tsilva/keyenv/issues"
Security = "https://github.com/tsilva/keyenv/security/policy"

[dependency-groups]
build = [
  "hatchling==1.31.0",
]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keyenv"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/architecture.png",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.uv]
required-version = "==0.11.13"
exclude-newer = "7 days"
constraint-dependencies = [
  "guardrails-ai!=0.10.1",
  "mistralai!=2.4.6",
]
