name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.13"
      - name: Verify tag version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: uv sync --locked --all-groups --config-file uv.toml
      - run: uv run --locked --config-file uv.toml ruff check .
      - run: uv run --locked --config-file uv.toml ruff format --check .
      - run: uv run --locked --config-file uv.toml mypy
      - run: uv run --locked --config-file uv.toml pip-audit
      - run: uv run --locked --config-file uv.toml python -m unittest discover -s tests -v
      - run: uv run --locked --config-file uv.toml python -m unittest discover -s tests -p 'test_integration_keychain.py' -v
        env:
          KEYENV_INTEGRATION: "1"
      - name: Create isolated distribution directory
        run: echo "KEYENV_DIST_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
      - run: uv build --config-file uv.toml --no-build-isolation --no-sources --out-dir "${KEYENV_DIST_DIR}"
        env:
          UV_OFFLINE: "1"
      - name: Remove uv build metadata
        run: rm -- "${KEYENV_DIST_DIR}/.gitignore"
      - run: uv run --locked --config-file uv.toml python scripts/check_artifacts.py "${KEYENV_DIST_DIR}"
      - name: Scan repository for credential-like content
        run: |
          if git grep -qE 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- . ':!uv.lock'; then
            echo "Potential credential found in repository content."
            exit 1
          fi
          if git grep -qE '/Users/[A-Za-z0-9._-]+/' -- .; then
            echo "Personal absolute path found in repository content."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            ${{ env.KEYENV_DIST_DIR }}/keyenv_macos-*.whl
            ${{ env.KEYENV_DIST_DIR }}/keyenv_macos-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Verify downloaded distributions
        run: python scripts/check_artifacts.py dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
