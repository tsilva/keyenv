name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.11.13"
      - run: uv sync --locked --all-groups
      - run: uv run --locked python -m unittest discover -s tests -v

  quality:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.11.13"
      - run: uv sync --locked --all-groups
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - name: Create isolated distribution directory
        run: echo "KEYENV_DIST_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
      - run: uv build --no-build-isolation --no-sources --out-dir "${KEYENV_DIST_DIR}"
        env:
          UV_OFFLINE: "1"
      - name: Remove uv build metadata
        run: rm -- "${KEYENV_DIST_DIR}/.gitignore"
      - run: uv run --locked python scripts/check_artifacts.py "${KEYENV_DIST_DIR}"
      - name: Scan repository for credential-like content
        run: |
          if git grep -qE 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- . ':!uv.lock'; then
            echo "Potential credential found in repository content."
            exit 1
          fi
          if git grep -qE '/Users/[A-Za-z0-9._-]+/' -- .; then
            echo "Personal absolute path found in repository content."
            exit 1
          fi

  keychain-integration:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.11.13"
      - run: uv sync --locked --all-groups
      - run: uv run --locked python -m unittest discover -s tests -p 'test_integration_keychain.py' -v
        env:
          KEYENV_INTEGRATION: "1"
