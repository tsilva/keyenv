name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m unittest discover -s tests -v

  quality:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv build
      - run: uv run python scripts/check_artifacts.py
      - name: Scan repository for credential-like content
        run: |
          if git grep -nE 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- . ':!uv.lock'; then
            echo "Potential credential found in repository content."
            exit 1
          fi
          if git grep -nE '/Users/[A-Za-z0-9._-]+/' -- .; then
            echo "Personal absolute path found in repository content."
            exit 1
          fi

  keychain-integration:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python -m unittest discover -s tests -p 'test_integration_keychain.py' -v
        env:
          KEYENV_INTEGRATION: "1"
